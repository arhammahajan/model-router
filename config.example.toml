# Development example: routerd fronts an external or embedded CLIProxyAPI
# service. No `[providers.*]`, `[[models]]`, or `[catalog]` sections are
# needed: model names are discovered from the proxy as opaque IDs (e.g.
# `opencode-go/...`), and the generated `cliproxyapi` provider speaks OpenAI
# Chat while routerd keeps cross-dialect translation.
# Upstream AI/OAuth credentials live only in the CLIProxyAPI YAML/env, never here.
[server]
host = "127.0.0.1"
port = 4000
auth_mode = "required"
api_keys = ["replace-this-local-key"]
allow_dynamic_routes = false

[retry]
max_attempts = 1

[cliproxyapi]
compatibility = "lossy"
base_url = "http://127.0.0.1:8317/v1"
api_key = "replace-this-proxy-key"
# To supply the proxy key from the environment instead of inline, replace
# `api_key` with `api_key_env = "CLIPROXYAPI_API_KEY"` (or `api_key_file`).
# Optional embedded mode: point at a CLIProxyAPI YAML file to run the SDK
# service in-process instead of dialing an external proxy listener.
# config_path = "/path/to/cliproxyapi-config.yaml"

# External mode (default): start CLIProxyAPI separately on port 8317, then
# start routerd with this file. Request flow:
# client -> routerd (port 4000) -> CLIProxyAPI (port 8317)
#   -> opencode-go-cliproxyapi plugin -> OpenCode Go upstream.
# Embedded mode: set `config_path` and routerd starts the SDK service
# itself; no separate proxy process is needed.
# See cliproxyapi.example.yaml for the proxy-side access key and
# `plugins.configs.opencode-go-cliproxyapi` setup (secrets from env).

# Opt-in usage metering: one metadata-only JSONL record per completed
# generation (never bodies, prompts, headers or identities). Uncomment to
# enable; `router usage` aggregates the file. Records rotate to
# usage.jsonl.1 once the file exceeds the bound, keeping one generation.
# [accounting]
# path = "${HOME}/.local/state/router/usage.jsonl"
# max_file_bytes = 104857600
