name: Go contracts and archive smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.6'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: go mod download
      - name: Formatting, vet and race tests
        run: |
          test -z "$(gofmt -l internal cmd)"
          go vet ./...
          go test -race -count=1 ./...
      - name: External HTTP contracts and runner tests
        run: |
          go build -o "$RUNNER_TEMP/model-router-go" ./cmd/model-router
          python3 conformance/test_run.py
          python3 conformance/run.py --backend go --go-bin "$RUNNER_TEMP/model-router-go"

  archive-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RELEASE_VERSION: 0.1.0-ci.${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.6'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: go mod download
      - name: Build and run the host archive
        run: |
          target="$(go env GOOS)/$(go env GOARCH)"
          python3 scripts/build_release.py --version "$RELEASE_VERSION" --out "$RUNNER_TEMP/router-release" --target "$target"
          python3 scripts/check_release.py "$RUNNER_TEMP"/router-release/*.tar.gz --version "$RELEASE_VERSION"
